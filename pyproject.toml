[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llano-v12ultra-ctrl"
dynamic = ["version"]
description = "Native Linux control tool for the llano V12 Ultra USB-HID cooling pad (Myth.Cool / Holtek 374a:b101) - CLI + PyQt6 GUI"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Quahuay" }]
dependencies = [
    "plyer>=2.1",              # cross-platform desktop notifications (notify.py, fan_reminder)
    "wmi>=1.5; sys_platform=='win32'",  # CPU temp on Windows via LibreHardwareMonitor (temp.py) - needs LibreHardwareMonitor running, see README Windows Status
    "hid>=1.0.5; sys_platform=='win32'",  # _WindowsDevice in device.py (Linux deliberately uses raw ioctls instead of hidapi)
]

[project.optional-dependencies]
gui = ["PyQt6>=6.5"]

[project.scripts]
llano-v12ultra-ctrl = "llano_v12ultra_ctrl.cli:main"
llano-v12ultra-ctrl-gui = "llano_v12ultra_ctrl.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
# Einzige Versionsquelle bleibt __init__.py (__version__) - packaging-Configs
# (cx_Freeze/fpm/PKGBUILD/AppImage, siehe packaging/) UND update_check.py
# lesen von dort statt hier zu duplizieren.
version = { attr = "llano_v12ultra_ctrl.__version__" }
