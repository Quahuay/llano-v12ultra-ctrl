[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llano-v12ultra-ctrl"
version = "0.1.0"
description = "Native Linux-Steuerung für das llano V12 Ultra USB-HID Kühlpad (Myth.Cool / Holtek 374a:b101) - CLI + PyQt6-GUI"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Quahuay" }]
dependencies = [
    "plyer>=2.1",              # cross-platform Desktop-Notifications (notify.py, fan_reminder)
    "wmi>=1.5; sys_platform=='win32'",  # CPU-Temp unter Windows via LibreHardwareMonitor (temp.py) - UNGETESTET
    "hid>=1.0.5; sys_platform=='win32'",  # _WindowsDevice in device.py (Linux nutzt bewusst rohe ioctls statt hidapi)
]

[project.optional-dependencies]
gui = ["PyQt6>=6.5"]

[project.scripts]
llano-v12ultra-ctrl = "llano_v12ultra_ctrl.cli:main"
llano-v12ultra-ctrl-gui = "llano_v12ultra_ctrl.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]
