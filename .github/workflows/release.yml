name: Release artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install fpm
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential
          sudo gem install --no-document fpm
      - name: Build .deb
        run: bash packaging/deb/build.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: dist/*.deb

  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FUSE (needed to run appimagetool)
        run: sudo apt-get update && sudo apt-get install -y libfuse2
      - name: Build AppImage
        run: bash packaging/appimage/build.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.AppImage

  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          pacman -Sy --noconfirm base-devel python python-build python-installer python-wheel python-setuptools python-pyqt6 git
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Build package
        run: |
          mkdir -p build && cp packaging/PKGBUILD build/
          chown -R builder:builder build
          su builder -c "cd build && makepkg --noconfirm --skipchecksums"
          mv build/*.pkg.tar.zst .
      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: "*.pkg.tar.zst"

  msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: pip install ".[gui]" cx_Freeze
      - name: Download hidapi.dll
        shell: bash
        run: |
          curl -fsSL -o hidapi-win.zip https://github.com/libusb/hidapi/releases/latest/download/hidapi-win.zip
          unzip -o hidapi-win.zip x64/hidapi.dll -d hidapi-extracted
          cp hidapi-extracted/x64/hidapi.dll packaging/msi/hidapi.dll
      - name: Build MSI
        run: python packaging/msi/cx_freeze_setup.py bdist_msi
      - uses: actions/upload-artifact@v4
        with:
          name: msi-installer
          path: dist/*.msi

  release:
    needs: [deb, appimage, arch, msi]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            deb-package/*.deb
            appimage/*.AppImage
            arch-package/*.pkg.tar.zst
            msi-installer/*.msi
