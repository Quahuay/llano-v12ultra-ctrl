name: Release artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Bestehendes Release (Tag, z. B. v0.1.4), dessen Assets mit dem
          gewaehlten Ref neu gebaut und ersetzt werden. Leer lassen, um nur
          Artefakte zu bauen (kein Release-Upload).
        required: false
        type: string

jobs:
  # Läuft vor allen Build-Jobs: ein Paket zu bauen, dessen Code nicht
  # durchläuft, hilft niemandem. Bewusst ohne pytest/venv - die Tests nutzen
  # nur die Standardbibliothek und laufen damit ohne Installationsschritt,
  # passend dazu, dass das Projekt auch zur Laufzeit ohne HID-Fremdbibliothek
  # auskommt.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]  # unterste unterstützte + aktuelle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -v

  deb:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install fpm
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential
          sudo gem install --no-document fpm
      - name: Build .deb
        run: bash packaging/deb/build.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: dist/*.deb

  appimage:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FUSE (needed to run appimagetool)
        run: sudo apt-get update && sudo apt-get install -y libfuse2
      - name: Build AppImage
        run: bash packaging/appimage/build.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.AppImage

  arch:
    needs: test
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          pacman -Sy --noconfirm base-devel python python-build python-installer python-wheel python-setuptools python-pyqt6 git
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Build package
        run: |
          mkdir -p build && cp packaging/PKGBUILD build/
          chown -R builder:builder build
          su builder -c "cd build && makepkg --noconfirm --skipchecksums"
          mv build/*.pkg.tar.zst .
      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: "*.pkg.tar.zst"

  msi:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: pip install ".[gui]" cx_Freeze
      - name: Download hidapi.dll
        shell: bash
        run: |
          curl -fsSL -o hidapi-win.zip https://github.com/libusb/hidapi/releases/latest/download/hidapi-win.zip
          unzip -o hidapi-win.zip x64/hidapi.dll -d hidapi-extracted
          cp hidapi-extracted/x64/hidapi.dll packaging/msi/hidapi.dll
      - name: Build MSI
        run: python packaging/msi/cx_freeze_setup.py bdist_msi
      - uses: actions/upload-artifact@v4
        with:
          name: msi-installer
          path: dist/*.msi

  release:
    needs: [deb, appimage, arch, msi]
    # Normalerweise nur bei Tag-Push. Zusaetzlich kann ein Workflow-Dispatch mit
    # gesetztem release_tag ein bestehendes Release mit den hier gebauten
    # Artefakten aktualisieren (z. B. Rebuild von v0.1.4 nach Fixes an den
    # Build-Skripten, ohne neuen Tag).
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            deb-package/*.deb
            appimage/*.AppImage
            arch-package/*.pkg.tar.zst
            msi-installer/*.msi
