# Example configuration for `llano-v12ultra-ctrl auto`.
# Copy to ~/.config/llano-v12ultra-ctrl/config.toml and adjust as needed.
#
# "auto" switches the RGB color (0=red, 1=lightblue, 2=green, 3=purple,
# 4=orange) based on CPU temperature - a visual temperature indicator right
# on the pad. There's also a separate GPU temperature alert below (purple +
# breathing effect) that overrides the CPU color logic when needed, plus an
# optional (fan_curve, enabled by default since v0.1.3) real temperature-based
# fan speed control.

[general]
# CLI/GUI language: "en" (default) or "de". Can also be overridden per call
# via the LLANO_LANGUAGE environment variable without touching this file.
language = "en"
# Once every 24h, quietly check GitHub Releases for a newer version (see
# update_check.py) - never a silent self-updater, just a notice + link.
# false disables the check entirely (no network call).
update_check = true

[auto]
# null/commented out = auto-detect (coretemp "Package id 0" or k10temp "Tctl"/"Tdie")
# temp_sensor = "/sys/class/hwmon/hwmon10/temp1_input"
poll_interval_s = 5
hysteresis_c = 3

[[auto.thresholds]]
temp_c = 0
color = 2   # green = cool

[[auto.thresholds]]
temp_c = 55
color = 4   # orange = warm

[[auto.thresholds]]
temp_c = 70
color = 0   # red = hot

# effect/speed are optional (default: 0=solid, 0=fast). A high threshold can
# use this to set a more noticeable effect instead of just a different
# color, e.g. chase (3) as a clearly visible critical alert.
[[auto.thresholds]]
temp_c = 85
color = 0    # red
effect = 3   # chase
speed = 0    # 0=fast

# GPU temperature alert: overrides the CPU color logic above with purple
# (color=3) + breathing (effect=1) once the GPU is >= temp_c AND at least as
# hot as the current CPU temperature ("whichever is hotter wins"). Once the
# GPU temperature drops below (temp_c - hysteresis_c), the daemon falls back
# to the normal CPU color logic. Source: nvidia-smi.
[auto.gpu_alert]
enabled = true
temp_c = 87
hysteresis_c = 5
color = 3    # purple
effect = 1   # breathing
speed = 0    # 0=fast (officially used range 0-3)

# Fan reminder: sends a desktop notification when the CPU is >= temp_c but
# the measured speed stays below min_rpm. Useful as a stopgap while
# fan_curve (below) isn't enabled. cooldown_s prevents spamming while the
# condition persists.
[auto.fan_reminder]
enabled = false
temp_c = 75
min_rpm = 1500
cooldown_s = 300

# Fan curve: maps CPU temperature to a fan_speed raw value (1-100, roughly
# 25 RPM per step, see protocol.py NACHTRAG 8/9) via piecewise linear
# interpolation. Points don't need to be sorted by temp_c in the file, they
# get sorted internally. Below the lowest / above the highest point, the
# respective edge value is held (no extrapolation). min_change_raw prevents
# constantly re-adjusting on small temperature fluctuations - it only
# writes when the target value changes by at least this much. Enabled by
# default since v0.1.3 (the software fan control is hardware-verified, see
# PROTOCOL.md NACHTRAG 8/11) - set to false below to opt back out.
[auto.fan_curve]
enabled = true
min_change_raw = 3

[[auto.fan_curve.points]]
temp_c = 30
raw = 1      # 300 RPM

[[auto.fan_curve.points]]
temp_c = 50
raw = 30     # approx. 1050 RPM

[[auto.fan_curve.points]]
temp_c = 70
raw = 60     # approx. 1800 RPM

[[auto.fan_curve.points]]
temp_c = 85
raw = 100    # 2800 RPM

# CSV history log (timestamp/temperatures/RPM/color/effect) for later
# analysis, e.g. to find a suitable wheel position for typical loads. One
# line per poll_interval_s.
[auto.log]
enabled = false
path = "~/.local/share/llano-v12ultra-ctrl/history.csv"
